name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-skills.mjs
      - name: Skills CLI discovers every skill
        run: |
          expected=$(find skills -mindepth 3 -name SKILL.md | wc -l)
          found=$(npx -y skills add . --list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -cE '^│    [a-z]')
          echo "expected=$expected found=$found"
          test "$expected" = "$found"
